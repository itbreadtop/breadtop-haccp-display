<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>Breadtop Production Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, "Noto Sans TC", sans-serif;
}

h1 {
  text-align: center;
  margin: 20px 0;
  font-size: 42px;
}

#updated {
  text-align: center;
  color: #aaa;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

.card {
  border-radius: 16px;
  padding: 20px;
  min-height: 220px;
}

.green { background: #1e7f43; }
.red { background: #a11f1f; }
.yellow { background: #a67c00; }

.product-zh {
  font-size: 28px;
  font-weight: bold;
}

.product-en {
  font-size: 18px;
  opacity: 0.9;
  margin-bottom: 10px;
}

.line {
  font-size: 20px;
  margin-top: 6px;
}
</style>
</head>

<body>

<h1>Breadtop Production Queue</h1>
<div id="updated">Loading…</div>

<div class="grid" id="queue"></div>

<script>
function loadQueue() {
  fetch("./queue.json?ts=" + Date.now())
    .then(r => {
      if (!r.ok) throw new Error("JSON load failed");
      return r.json();
    })
    .then(data => {
      document.getElementById("updated").innerText =
        "更新時間：" + data.generated_at;

      const box = document.getElementById("queue");
      box.innerHTML = "";

      data.queue.forEach(item => {
        const card = document.createElement("div");
        card.className = "card " + item.color;

        card.innerHTML = `
          <div class="product-zh">${item.product_zh}</div>
          <div class="product-en">${item.product_en}</div>

          <div class="line">批次：${item.batch_no}</div>
          <div class="line">數量：${item.batch_count} 批</div>
          <div class="row">
            <span class="label">下一步 Next Stage：</span>
            <span class="value">
              ${item.next_stage_zh} / ${item.next_stage_en}
            </span>
          </div>
          <div class="line">狀態：準備好 ✅</div>
        `;

        box.appendChild(card);
      });
    })
    .catch(err => {
      document.getElementById("updated").innerText =
        "❌ queue.json 無法載入";
      console.error(err);
    });
}

loadQueue();
setInterval(loadQueue, 30000); // 每 30 秒 refresh
</script>

</body>
</html>
