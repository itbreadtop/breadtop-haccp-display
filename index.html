<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <title>Breadtop Production Queue</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: #fff;
      font-family: system-ui, -apple-system, Arial;
    }

    .wrap {
      padding: 20px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .meta {
      color: #bbb;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      background: #111a33;
      border-radius: 14px;
      padding: 14px;
      position: relative;
      border-left: 10px solid #2ecc71;
    }

    .urgent {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { border-left-color: #ff0000; }
    }

    .product-zh {
      font-size: 22px;
      font-weight: 800;
    }

    .product-en {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 10px;
    }

    .row {
      margin: 6px 0;
      font-size: 16px;
    }

    .label {
      color: #aaa;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script>
const e = React.createElement;

function Card({item}) {
  return e("div", {
    className: "card " + (item.priority === "urgent" ? "urgent" : ""),
    style: { borderLeftColor: item.color }
  }, [
    e("div", { className: "product-zh" }, item.product_zh),
    e("div", { className: "product-en" }, item.product_en),

    e("div", { className: "row" },
      e("span", { className: "label" }, "批次 Batch： "),
      item.batch_no
    ),

    e("div", { className: "row" },
      e("span", { className: "label" }, "數量 Qty： "),
      item.batch_count + " 批"
    ),

    e("div", { className: "row" },
      e("span", { className: "label" }, "下一步 Next： "),
      item.next_stage
    ),

    e("div", { className: "row" },
      e("span", { className: "label" }, "狀態 Status： "),
      "準備好 READY ✅"
    )
  ]);
}

function App() {
  const [data, setData] = React.useState(null);

  async function load() {
    const res = await fetch("queue.json?ts=" + Date.now());
    const json = await res.json();
    setData(json);
  }

  React.useEffect(() => {
    load();
    setInterval(load, 30000); // auto refresh
  }, []);

  if (!data) return e("div", null, "Loading...");

  return e("div", { className: "wrap" }, [
    e("h1", null, "生產隊列 Production Queue"),
    e("div", { className: "meta" },
      `日期 ${data.date} ｜ 更新 ${data.generated_at}`
    ),
    e("div", { className: "grid" },
      data.queue.map((q, i) => e(Card, { item: q, key: i }))
    )
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
